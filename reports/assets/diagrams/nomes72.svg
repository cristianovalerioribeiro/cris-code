<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300" font-family="DejaVu Sans, Liberation Sans, sans-serif"><rect width="780" height="300" fill="#fffdf9"/><text x="390.0" y="26" font-size="14" fill="#7a2e1d" text-anchor="middle" font-weight="bold" >Como se formam os 72 trigramas a partir de Êxodo 14:19–21</text><rect x="30" y="55" width="720" height="46" rx="5" fill="#fff" stroke="#2f6b4a" stroke-width="1.5"/><rect x="30" y="55" width="8" height="46" fill="#2f6b4a"/><text x="52" y="75" font-size="12" fill="#2f6b4a" text-anchor="start" font-weight="bold" >Versículo 19</text><text x="52" y="91" font-size="9.5" fill="#6b645a" text-anchor="start" font-weight="normal" >72 letras, lidas na ordem normal</text><text x="520" y="83" font-size="12" fill="#1d1b18" text-anchor="middle" font-weight="bold" >1ª  2ª  3ª  …  72ª</text><text x="700" y="86" font-size="22" fill="#2f6b4a" text-anchor="middle" font-weight="bold" >→</text><rect x="30" y="113" width="720" height="46" rx="5" fill="#fff" stroke="#a12a2a" stroke-width="1.5"/><rect x="30" y="113" width="8" height="46" fill="#a12a2a"/><text x="52" y="133" font-size="12" fill="#a12a2a" text-anchor="start" font-weight="bold" >Versículo 20</text><text x="52" y="149" font-size="9.5" fill="#6b645a" text-anchor="start" font-weight="normal" >72 letras, lidas de trás para frente</text><text x="520" y="141" font-size="12" fill="#1d1b18" text-anchor="middle" font-weight="bold" >72ª  71ª  70ª  …  1ª</text><text x="700" y="144" font-size="22" fill="#a12a2a" text-anchor="middle" font-weight="bold" >←</text><rect x="30" y="171" width="720" height="46" rx="5" fill="#fff" stroke="#2b4f7a" stroke-width="1.5"/><rect x="30" y="171" width="8" height="46" fill="#2b4f7a"/><text x="52" y="191" font-size="12" fill="#2b4f7a" text-anchor="start" font-weight="bold" >Versículo 21</text><text x="52" y="207" font-size="9.5" fill="#6b645a" text-anchor="start" font-weight="normal" >72 letras, lidas na ordem normal</text><text x="520" y="199" font-size="12" fill="#1d1b18" text-anchor="middle" font-weight="bold" >1ª  2ª  3ª  …  72ª</text><text x="700" y="202" font-size="22" fill="#2b4f7a" text-anchor="middle" font-weight="bold" >→</text><rect x="330" y="48" width="56" height="176" rx="6" fill="none" stroke="#a8791f" stroke-width="2.5" stroke-dasharray="6 4"/><text x="358" y="246" font-size="10.5" fill="#a8791f" text-anchor="middle" font-weight="bold" >cada coluna = 1 nome de 3 letras</text><text x="390.0" y="272" font-size="10" fill="#1d1b18" text-anchor="middle" font-weight="normal" >Nome n = (letra n do v. 19) + (letra n contada do fim do v. 20) + (letra n do v. 21). Total: 72 nomes, 216 letras.</text><text x="390.0" y="290" font-size="9.5" fill="#6b645a" text-anchor="middle" font-weight="normal" >O método é medieval e atestado; a tabela “um nome, uma função” é moderna.</text></svg>