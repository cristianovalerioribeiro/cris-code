<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 460" width="780" height="460" font-family="DejaVu Sans, Liberation Sans, sans-serif"><rect width="780" height="460" fill="#fffdf9"/><text x="390.0" y="24" font-size="14" fill="#7a2e1d" text-anchor="middle" font-weight="bold" >Onde vai a mezuzá — vista de quem ENTRA no cômodo</text><rect x="40" y="50" width="290" height="350" fill="#efe7d8" stroke="#d9d2c5"/><rect x="100" y="90" width="170" height="310" fill="#c9b79a" stroke="#8d7a5c"/><rect x="110" y="100" width="150" height="300" fill="#7b5a3a" stroke="#4d3722"/><rect x="122" y="114" width="126" height="126.0" fill="none" stroke="#5f4329" stroke-width="2"/><rect x="122" y="256.0" width="126" height="128.0" fill="none" stroke="#5f4329" stroke-width="2"/><circle cx="244" cy="250.0" r="4.5" fill="#a8791f"/><rect x="40" y="400" width="290" height="12" fill="#b9ab94" stroke="#8d7a5c"/><line x1="44" y1="200.0" x2="326" y2="200.0" stroke="#6b645a" stroke-dasharray="5 4" stroke-width="1"/><line x1="44" y1="300.0" x2="326" y2="300.0" stroke="#6b645a" stroke-dasharray="5 4" stroke-width="1"/><text x="46" y="154.0" font-size="9" fill="#6b645a" text-anchor="start" font-weight="normal" >terço superior</text><text x="46" y="254.0" font-size="9" fill="#6b645a" text-anchor="start" font-weight="normal" >terço médio</text><text x="46" y="354.0" font-size="9" fill="#6b645a" text-anchor="start" font-weight="normal" >terço inferior</text><g><rect x="260" y="164.0" width="10" height="38" rx="3" fill="#a8791f" stroke="#7a2e1d" stroke-width="1.5"/></g><line x1="277" y1="178.0" x2="335" y2="92" stroke="#7a2e1d" stroke-width="1.2"/><text x="325" y="70" font-size="10.5" fill="#7a2e1d" text-anchor="start" font-weight="bold" >umbral DIREITO de quem entra,</text><text x="325" y="85" font-size="10.5" fill="#7a2e1d" text-anchor="start" font-weight="bold" >no início do terço superior</text><text x="610" y="150" font-size="12" fill="#1d1b18" text-anchor="middle" font-weight="bold" >Inclinação: a divergência medieval</text><text x="610" y="332" font-size="9.3" fill="#1d1b18" text-anchor="middle" font-weight="normal" >Vista lateral do umbral: fora ← | → interior do cômodo</text><rect x="477" y="165" width="76" height="150" rx="5" fill="#fff" stroke="#d9d2c5"/><g transform="rotate(0 515 215)"><rect x="509" y="188" width="12" height="54" rx="3" fill="#a8791f" stroke="#7a2e1d" stroke-width="1.5"/></g><text x="515" y="270" font-size="10.5" fill="#1d1b18" text-anchor="middle" font-weight="bold" >Vertical</text><text x="515" y="285" font-size="7.6" fill="#6b645a" text-anchor="middle" font-weight="normal" >Rashi; Shulchan Aruch;</text><text x="515" y="297" font-size="7.6" fill="#6b645a" text-anchor="middle" font-weight="normal" >costume sefardita</text><rect x="573" y="165" width="76" height="150" rx="5" fill="#fff" stroke="#d9d2c5"/><g transform="rotate(22 611 215)"><rect x="605" y="188" width="12" height="54" rx="3" fill="#a8791f" stroke="#7a2e1d" stroke-width="1.5"/></g><text x="611" y="270" font-size="10.5" fill="#1d1b18" text-anchor="middle" font-weight="bold" >Inclinada</text><text x="611" y="285" font-size="7.6" fill="#6b645a" text-anchor="middle" font-weight="normal" >compromisso registrado</text><text x="611" y="297" font-size="7.6" fill="#6b645a" text-anchor="middle" font-weight="normal" >pelo Rema; asquenazita</text><rect x="669" y="165" width="76" height="150" rx="5" fill="#fff" stroke="#d9d2c5"/><g transform="rotate(-90 707 215)"><rect x="701" y="188" width="12" height="54" rx="3" fill="#a8791f" stroke="#7a2e1d" stroke-width="1.5"/></g><text x="707" y="270" font-size="10.5" fill="#1d1b18" text-anchor="middle" font-weight="bold" >Horizontal</text><text x="707" y="285" font-size="7.6" fill="#6b645a" text-anchor="middle" font-weight="normal" >Rabbenu Tam</text><text x="707" y="297" font-size="7.6" fill="#6b645a" text-anchor="middle" font-weight="normal" >(não é costume atual)</text><text x="610" y="348" font-size="9.3" fill="#6b645a" text-anchor="middle" font-weight="normal" >Na posição inclinada, o topo aponta para dentro do cômodo.</text><text x="390.0" y="446" font-size="9.3" fill="#a12a2a" text-anchor="middle" font-weight="normal" >Mandamento restrito a lares judaicos; o esquema é informativo. A norma local é a do rabino de cada comunidade.</text></svg>