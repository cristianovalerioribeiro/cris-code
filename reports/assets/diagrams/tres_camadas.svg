<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 470" width="780" height="470" font-family="DejaVu Sans, Liberation Sans, sans-serif"><rect width="780" height="470" fill="#fffdf9"/><text x="390.0" y="26" font-size="14" fill="#7a2e1d" text-anchor="middle" font-weight="bold" >A porta em três operações — proposta de síntese deste estudo</text><rect x="250" y="40" width="280" height="340" fill="#efe7d8" stroke="#d9d2c5"/><rect x="310" y="80" width="160" height="300" fill="#c9b79a" stroke="#8d7a5c"/><rect x="320" y="90" width="140" height="290" fill="#7b5a3a" stroke="#4d3722"/><rect x="332" y="104" width="116" height="121.0" fill="none" stroke="#5f4329" stroke-width="2"/><rect x="332" y="241.0" width="116" height="123.0" fill="none" stroke="#5f4329" stroke-width="2"/><circle cx="444" cy="235.0" r="4.5" fill="#a8791f"/><rect x="250" y="380" width="280" height="12" fill="#b9ab94" stroke="#8d7a5c"/><rect x="250" y="392" width="280" height="36" fill="#e6dfd0" stroke="#d9d2c5"/><text x="390.0" y="415" font-size="10" fill="#6b645a" text-anchor="middle" font-weight="normal" >soleira</text><rect x="330" y="52" width="120" height="20" rx="3" fill="#a8791f" opacity=".9"/><text x="390.0" y="66" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="bold" >verga: bênção</text><circle cx="280" cy="352" r="20" fill="#2f6b4a" opacity=".85"/><text x="280" y="356" font-size="8.5" fill="#fff" text-anchor="middle" font-weight="bold" >planta</text><circle cx="500" cy="150" r="14" fill="#34495e" opacity=".9"/><text x="500" y="154" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold" >olho</text><rect x="424" y="358" width="26" height="18" rx="3" fill="#2a7f86" opacity=".9"/><text x="437" y="371" font-size="8.5" fill="#fff" text-anchor="middle" font-weight="bold" >sal</text><rect x="14" y="80" width="222" height="82" rx="5" fill="#fff" stroke="#34495e" stroke-width="1.6"/><rect x="14" y="80" width="6" height="82" fill="#34495e"/><text x="28" y="97" font-size="11" fill="#34495e" text-anchor="start" font-weight="bold" >1. REPELIR — lado de fora</text><text x="28" y="113" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >Um único guardião, voltado para fora:</text><text x="28" y="127" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >planta (espada-de-são-jorge, arruda,</text><text x="28" y="141" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >guiné) ou amuleto aberto (figa,</text><text x="28" y="155" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >hamsa, olho grego, ferradura).</text><rect x="14" y="250" width="222" height="82" rx="5" fill="#fff" stroke="#2a7f86" stroke-width="1.6"/><rect x="14" y="250" width="6" height="82" fill="#2a7f86"/><text x="28" y="267" font-size="11" fill="#2a7f86" text-anchor="start" font-weight="bold" >2. PURIFICAR — na soleira</text><text x="28" y="283" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >Um gesto repetido, não um objeto:</text><text x="28" y="297" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >sal grosso trocado toda semana,</text><text x="28" y="311" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >defumação periódica, lavar a soleira.</text><text x="28" y="325" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >O que não se renova vira enfeite.</text><rect x="544" y="80" width="222" height="82" rx="5" fill="#fff" stroke="#a8791f" stroke-width="1.6"/><rect x="544" y="80" width="6" height="82" fill="#a8791f"/><text x="558" y="97" font-size="11" fill="#a8791f" text-anchor="start" font-weight="bold" >3. CONVIDAR — verga e interior</text><text x="558" y="113" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >Uma única bênção, na tradição do</text><text x="558" y="127" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >morador: giz da Epifania, mezuzá</text><text x="558" y="141" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >(casa judaica), frase própria.</text><text x="558" y="155" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >Prosperidade fica do lado de dentro.</text><rect x="544" y="250" width="222" height="82" rx="5" fill="#fff" stroke="#a12a2a" stroke-width="1.6"/><rect x="544" y="250" width="6" height="82" fill="#a12a2a"/><text x="558" y="267" font-size="11" fill="#a12a2a" text-anchor="start" font-weight="bold" >FORA DA SÍNTESE</text><text x="558" y="283" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >Práticas que pedem pertença ou</text><text x="558" y="297" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >consagração: mezuzá em casa não</text><text x="558" y="311" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >judaica, ponto riscado, tronqueira,</text><text x="558" y="325" font-size="9.3" fill="#1d1b18" text-anchor="start" font-weight="normal" >ofuda, fulu. E símbolos de ódio.</text><text x="390.0" y="452" font-size="9.3" fill="#6b645a" text-anchor="middle" font-weight="normal" >Síntese proposta pelo estudo a partir de padrões recorrentes; não é prescrição de nenhuma tradição nem promessa de efeito.</text></svg>