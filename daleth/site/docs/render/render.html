<!doctype html><html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/site.css">
<style>
html,body{margin:0;background:#082538;overflow:hidden}
.cena{position:fixed;inset:0}
.cena canvas{width:100%;height:100%;display:block}
.og{position:fixed;inset:0;display:none;color:#fff;padding:64px 72px;box-sizing:border-box;flex-direction:column;justify-content:space-between;
  background:linear-gradient(90deg,rgba(8,37,56,.95) 0%,rgba(8,37,56,.85) 42%,rgba(8,37,56,.1) 72%)}
.og img{width:230px;height:auto}
.og h1{font:600 64px/1.04 "Source Serif 4",Georgia,serif;letter-spacing:-.02em;max-width:12.5ch;margin:0}
.og h1 em{color:#D4B37C}
.og p{font:500 20px/1.3 Inter,sans-serif;color:#B9C8D4;margin:0;letter-spacing:.02em}
.og .faixa{position:fixed;left:0;right:0;bottom:0;height:6px;background:#B58A44}
body.modo-og .og{display:flex}
</style></head><body>
<div class="cena"><canvas data-cena="heroi" data-rotulos="Empresa|Terreno|Caixa|Capital|Sociedade|Execução"></canvas><div class="cena-rotulos"></div></div>
<div class="og"><img src="/assets/marca/horizontal-negative.svg" alt="">
<h1>Seu próximo empreendimento pode ser <em>o maior até aqui.</em></h1>
<p>Estruturação de negócios imobiliários · Belo Horizonte · atuação nacional</p><div class="faixa"></div></div>
<script>(function(){var q=new URLSearchParams(location.search),c=document.querySelector(".cena canvas"),h=document.querySelector(".cena");
if(q.get("cena"))c.setAttribute("data-cena",q.get("cena"));if(q.get("rot")!==null)c.setAttribute("data-rotulos",q.get("rot"));
if(q.get("centro"))c.setAttribute("data-centro","");if(q.get("angulo"))c.setAttribute("data-angulo",q.get("angulo"));if(q.get("z"))h.style.setProperty("--z",q.get("z"));
if(q.get("tema")){c.setAttribute("data-tema",q.get("tema"));h.classList.add("hero-narrativa");}if(q.get("fundo")){document.body.style.background=q.get("fundo");document.documentElement.style.background=q.get("fundo");}})();</script>
<script>if(location.hash==="#og")document.body.classList.add("modo-og");if(location.hash==="#limpo")document.querySelector(".cena-rotulos").style.display="none";</script>
<script src="/assets/js/cena3d.js"></script>
</body></html>
