# =============================================================================
#  ARQUIVO GERADO AUTOMATICAMENTE — NAO EDITE A MAO.
#
#  Fonte:   config/comodos.yaml
#  Comando: python3 tools/gerar_painel.py
#
#  Qualquer alteracao feita diretamente aqui e perdida na proxima geracao.
# =============================================================================

views:
  - title: Casa
    path: casa
    icon: mdi:home
    type: sections
    max_columns: 4
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: heading
            heading: Casa
            heading_style: title
            icon: mdi:home-heart
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:lightbulb-group
                icon_color: |-
                  {% if states.light | selectattr('state', 'eq', 'on') | list | count > 0 %}amber{% else %}grey{% endif %}
                content: |-
                  {% set n = states.light | selectattr('state', 'eq', 'on') | list | count %}{% if n == 0 %}Tudo apagado{% elif n == 1 %}1 luz acesa{% else %}{{ n }} luzes acesas{% endif %}
                tap_action:
                  action: navigate
                  navigation_path: /painel-novo/luzes
              - type: template
                icon: mdi:lightbulb-off-outline
                icon_color: red
                content: Apagar tudo
                tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id: all
                confirmation:
                  text: Apagar todas as luzes da casa?
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Sala de Estar
            heading_style: title
            icon: mdi:sofa
            tap_action:
              action: navigate
              navigation_path: /painel-novo/sala-de-estar
          - type: custom:mushroom-template-card
            primary: Sala de Estar
            secondary: |-
              {% set luzes = area_entities('Sala de Estar') | select('match', 'light\\.') | list %}{% set acesas = luzes | select('is_state', 'on') | list %}{% if luzes | count == 0 %}Nenhuma luz nesta area{% elif acesas | count == 0 %}Tudo apagado{% else %}{{ acesas | count }} de {{ luzes | count }} acesa(s){% endif %}
            icon: mdi:sofa
            icon_color: |-
              {% if area_entities('Sala de Estar') | select('match', 'light\\.') | list | select('is_state', 'on') | list | count > 0 %}amber{% else %}disabled{% endif %}
            multiline_secondary: false
            tap_action:
              action: perform-action
              perform_action: script.alternar_luzes_da_area
              data:
                area: Sala de Estar
            hold_action:
              action: navigate
              navigation_path: /painel-novo/sala-de-estar
            grid_options:
              columns: full
          - type: custom:auto-entities
            card:
              type: grid
              columns: 2
              square: false
            card_param: cards
            show_empty: false
            filter:
              include:
                - domain: light
                  area: Sala de Estar
                  options:
                    type: custom:mushroom-light-card
                    layout: vertical
                    show_brightness_control: true
                    show_color_temp_control: true
                    show_color_control: true
                    use_light_color: true
                    collapsible_controls: true
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
                    double_tap_action:
                      action: more-info
              exclude:
                - entity_id: light.*_grupo
                - entity_id: light.grupo_*
                - entity_id: light.todas_as_luzes
            sort:
              method: friendly_name
            grid_options:
              columns: full
