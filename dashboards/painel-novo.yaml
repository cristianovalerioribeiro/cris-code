# =============================================================================
#  ARQUIVO GERADO AUTOMATICAMENTE — NAO EDITE A MAO.
#
#  Fonte:   config/comodos.yaml
#  Comando: python3 tools/gerar_painel.py
#
#  Qualquer alteracao feita diretamente aqui e perdida na proxima geracao.
# =============================================================================

views:
  - title: Térreo
    path: terreo
    icon: mdi:home-floor-g
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Cozinha
            heading_style: title
            icon: mdi:countertop
            tap_action:
              action: navigate
              navigation_path: /painel-novo/cozinha
          - type: custom:mushroom-template-card
            primary: Luzes
            secondary: |-
              {% set l = area_entities('Cozinha') | select('match', 'light\\.') | list %}{% set ns = namespace(r=[]) %}{% for e in l %}{% set nm = (state_attr(e, 'friendly_name') or '') | lower %}{% if not ((e | lower) is search('.*[ _]grupo|grupo[ _].*|todas[ _]as[ _]luzes|.*lavanderia.*|.*dispensa.*') or nm is search('.*[ _]grupo|grupo[ _].*|todas[ _]as[ _]luzes|.*lavanderia.*|.*dispensa.*')) %}{% set ns.r = ns.r + [e] %}{% endif %}{% endfor %}{% set l = ns.r %}{% set on = l | select('is_state', 'on') | list %}{% if l | count == 0 %}Nenhuma luz encontrada{% elif on | count == 0 %}Tudo apagado{% elif on | count == l | count %}Todas acesas ({{ l | count }}){% else %}{{ on | count }} de {{ l | count }} acesas{% endif %}
            icon: |-
              {% set l = area_entities('Cozinha') | select('match', 'light\\.') | list %}{% set ns = namespace(r=[]) %}{% for e in l %}{% set nm = (state_attr(e, 'friendly_name') or '') | lower %}{% if not ((e | lower) is search('.*[ _]grupo|grupo[ _].*|todas[ _]as[ _]luzes|.*lavanderia.*|.*dispensa.*') or nm is search('.*[ _]grupo|grupo[ _].*|todas[ _]as[ _]luzes|.*lavanderia.*|.*dispensa.*')) %}{% set ns.r = ns.r + [e] %}{% endif %}{% endfor %}{% set l = ns.r %}{% set on = l | select('is_state', 'on') | list %}{% if on | count > 0 %}mdi:lightbulb-group{% else %}mdi:lightbulb-group-off{% endif %}
            icon_color: |-
              {% set l = area_entities('Cozinha') | select('match', 'light\\.') | list %}{% set ns = namespace(r=[]) %}{% for e in l %}{% set nm = (state_attr(e, 'friendly_name') or '') | lower %}{% if not ((e | lower) is search('.*[ _]grupo|grupo[ _].*|todas[ _]as[ _]luzes|.*lavanderia.*|.*dispensa.*') or nm is search('.*[ _]grupo|grupo[ _].*|todas[ _]as[ _]luzes|.*lavanderia.*|.*dispensa.*')) %}{% set ns.r = ns.r + [e] %}{% endif %}{% endfor %}{% set l = ns.r %}{% set on = l | select('is_state', 'on') | list %}{% if on | count > 0 %}orange{% else %}disabled{% endif %}
            multiline_secondary: false
            tap_action:
              action: perform-action
              perform_action: script.alternar_luzes_do_bloco
              data:
                area: Cozinha
                excluir: .*[ _]grupo|grupo[ _].*|todas[ _]as[ _]luzes|.*lavanderia.*|.*dispensa.*
            hold_action:
              action: navigate
              navigation_path: /painel-novo/cozinha
            double_tap_action:
              action: navigate
              navigation_path: /painel-novo/cozinha
            grid_options:
              columns: full
          - type: custom:auto-entities
            card:
              type: custom:mushroom-chips-card
              alignment: start
            card_param: chips
            show_empty: false
            filter:
              include:
                - domain: light
                  area: Cozinha
                  options:
                    type: entity
                    content_info: name
                    use_light_color: true
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
              exclude:
                - entity_id: '*_grupo'
                - name: '* grupo'
                - name: '* Grupo'
                - name: '* GRUPO'
                - entity_id: grupo_*
                - name: grupo *
                - name: Grupo *
                - name: GRUPO *
                - entity_id: todas_as_luzes
                - name: todas as luzes
                - name: Todas as luzes
                - name: Todas As Luzes
                - name: TODAS AS LUZES
                - entity_id: '*lavanderia*'
                - name: '*lavanderia*'
                - name: '*Lavanderia*'
                - name: '*LAVANDERIA*'
                - entity_id: '*dispensa*'
                - name: '*dispensa*'
                - name: '*Dispensa*'
                - name: '*DISPENSA*'
            grid_options:
              columns: full
            sort:
              method: friendly_name
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            show_empty: false
            filter:
              include:
                - domain: cover
                  area: Cozinha
                  options:
                    type: custom:mushroom-cover-card
                    layout: horizontal
                    show_buttons_control: true
                    show_position_control: false
                    tap_action:
                      action: more-info
                    hold_action:
                      action: more-info
              exclude: []
            grid_options:
