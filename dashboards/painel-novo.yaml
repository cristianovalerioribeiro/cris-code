# =============================================================================
#  ARQUIVO GERADO AUTOMATICAMENTE — NAO EDITE A MAO.
#
#  Fonte:   config/comodos.yaml
#  Comando: python3 tools/gerar_painel.py
#
#  Qualquer alteracao feita diretamente aqui e perdida na proxima geracao.
# =============================================================================

views:
  - title: Casa
    path: casa
    icon: mdi:home
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        column_span: 3
        cards:
          - type: heading
            heading: Casa
            heading_style: title
            icon: mdi:home-heart
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: |-
                  {% if states.light | selectattr('state', 'eq', 'on') | list | count > 0 %}mdi:lightbulb-group{% else %}mdi:lightbulb-group-off{% endif %}
                icon_color: |-
                  {% if states.light | selectattr('state', 'eq', 'on') | list | count > 0 %}amber{% else %}grey{% endif %}
                content: |-
                  {% set n = states.light | selectattr('state', 'eq', 'on') | list | count %}{% if n == 0 %}Tudo apagado{% elif n == 1 %}1 luz acesa{% else %}{{ n }} luzes acesas{% endif %}
                tap_action:
                  action: navigate
                  navigation_path: /painel-novo/luzes
              - type: template
                icon: mdi:window-shutter-open
                icon_color: |-
                  {% if states.cover | rejectattr('state', 'eq', 'closed') | rejectattr('state', 'eq', 'unavailable') | list | count > 0 %}blue{% else %}grey{% endif %}
                content: |-
                  {% set n = states.cover | rejectattr('state', 'eq', 'closed') | rejectattr('state', 'eq', 'unavailable') | list | count %}{% if n == 0 %}Tudo fechado{% elif n == 1 %}1 aberta{% else %}{{ n }} abertas{% endif %}
                tap_action:
                  action: none
              - type: template
                icon: mdi:lightbulb-off-outline
                icon_color: red
                content: Apagar tudo
                tap_action:
                  action: perform-action
                  perform_action: light.turn_off
                  target:
                    entity_id: all
                confirmation:
                  text: Apagar todas as luzes da casa?
            grid_options:
              columns: full
      - type: grid
        cards:
          - type: heading
            heading: Sala de Estar
            heading_style: title
            icon: mdi:sofa
            badges:
              - type: entity
                entity: sensor.sala_temperatura
              - type: entity
                entity: sensor.sala_umidade
            tap_action:
              action: navigate
              navigation_path: /painel-novo/sala-de-estar
          - type: custom:mushroom-light-card
            entity: light.sala_luzes
            name: Luzes do comodo
            icon: mdi:lightbulb-group
            show_brightness_control: false
            show_color_temp_control: false
            show_color_control: false
            use_light_color: true
            collapsible_controls: false
            layout: horizontal
            tap_action:
              action: perform-action
              perform_action: script.alternar_luzes_da_area
              data:
                area: Sala de Estar
            hold_action:
              action: navigate
              navigation_path: /painel-novo/sala-de-estar
            double_tap_action:
              action: navigate
              navigation_path: /painel-novo/sala-de-estar
            grid_options:
              columns: full
          - type: custom:auto-entities
            card:
              type: custom:mushroom-chips-card
              alignment: start
            card_param: chips
            show_empty: false
            filter:
              include:
                - domain: light
                  area: Sala de Estar
                  options:
                    type: entity
                    content_info: name
                    use_light_color: true
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
              exclude:
                - entity_id: light.*_grupo
                - entity_id: light.grupo_*
                - entity_id: light.todas_as_luzes
                - entity_id: light.sala_luzes
            grid_options:
              columns: full
            sort:
              method: friendly_name
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            show_empty: false
            filter:
              include:
                - domain: cover
                  area: Sala de Estar
                  options:
                    type: custom:mushroom-cover-card
                    layout: horizontal
                    show_buttons_control: true
                    show_position_control: false
                    tap_action:
                      action: more-info
                    hold_action:
                      action: more-info
              exclude: []
            grid_options:
              columns: full
            sort:
              method: friendly_name
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            show_empty: false
            filter:
              include:
                - domain: sensor
                  area: Sala de Estar
                  options:
                    type: tile
                    vertical: false
                    hide_state: false
                    tap_action:
                      action: more-info
                - domain: binary_sensor
                  area: Sala de Estar
                  options:
                    type: tile
                    vertical: false
                    hide_state: false
                    tap_action:
                      action: more-info
              exclude:
                - entity_id: sensor.sala_temperatura
                - entity_id: sensor.sala_umidade
            grid_options:
              columns: full
            sort:
              method: friendly_name
          - type: grid
            columns: 2
            square: false
            cards:
              - type: tile
                entity: climate.sala_ar
                hold_action:
                  action: more-info
              - type: tile
                entity: media_player.sala_tv
