            alignment: center
            chips:
              - type: template
                icon: |-
                  {% if states.light | selectattr('state', 'eq', 'on') | list | count > 0 %}mdi:lightbulb-group{% else %}mdi:lightbulb-group-off{% endif %}
                icon_color: |-
                  {% if states.light | selectattr('state', 'eq', 'on') | list | count > 0 %}amber{% else %}grey{% endif %}
                content: |-
                  {% set n = states.light | selectattr('state', 'eq', 'on') | list | count %}{% if n == 0 %}Tudo apagado{% elif n == 1 %}1 luz acesa{% else %}{{ n }} luzes acesas{% endif %}
                tap_action:
                  action: none
              - type: template
                icon: mdi:window-shutter-open
                icon_color: |-
                  {% if states.cover | rejectattr('state', 'eq', 'closed') | rejectattr('state', 'eq', 'unavailable') | list | count > 0 %}blue{% else %}grey{% endif %}
                content: |-
                  {% set n = states.cover | rejectattr('state', 'eq', 'closed') | rejectattr('state', 'eq', 'unavailable') | list | count %}{% if n == 0 %}Tudo fechado{% elif n == 1 %}1 aberta{% else %}{{ n }} abertas{% endif %}
                tap_action:
