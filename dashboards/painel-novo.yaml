# =============================================================================
#  ARQUIVO GERADO AUTOMATICAMENTE — NAO EDITE A MAO.
#
#  Fonte:   config/comodos.yaml
#  Comando: python3 tools/gerar_painel.py
#
#  Qualquer alteracao feita diretamente aqui e perdida na proxima geracao.
# =============================================================================

views:
  - title: Térreo
    path: terreo
    icon: mdi:home-floor-g
    type: sections
    max_columns: 3
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Cozinha
            heading_style: title
            icon: mdi:countertop
            tap_action:
              action: navigate
              navigation_path: /painel-novo/cozinha
          - type: custom:mushroom-template-card
            primary: Luzes
            secondary: |-
              {% set l = (((area_entities('Cozinha') | select('match', 'light\\.') | list) | reject('match', 'light\\..*_grupo|light\\.grupo_.*|light\\.todas_as_luzes|light\\..*lavanderia.*|light\\..*dispensa.*') | list) | unique | list) %}{% set on = l | select('is_state', 'on') | list %}{% if l | count == 0 %}Nenhuma luz encontrada{% elif on | count == 0 %}Tudo apagado{% elif on | count == l | count %}Todas acesas ({{ l | count }}){% else %}{{ on | count }} de {{ l | count }} acesas{% endif %}
            icon: |-
              {% if (((area_entities('Cozinha') | select('match', 'light\\.') | list) | reject('match', 'light\\..*_grupo|light\\.grupo_.*|light\\.todas_as_luzes|light\\..*lavanderia.*|light\\..*dispensa.*') | list) | unique | list) | select('is_state', 'on') | list | count > 0 %}mdi:lightbulb-group{% else %}mdi:lightbulb-group-off{% endif %}
            icon_color: |-
              {% if (((area_entities('Cozinha') | select('match', 'light\\.') | list) | reject('match', 'light\\..*_grupo|light\\.grupo_.*|light\\.todas_as_luzes|light\\..*lavanderia.*|light\\..*dispensa.*') | list) | unique | list) | select('is_state', 'on') | list | count > 0 %}orange{% else %}disabled{% endif %}
            multiline_secondary: false
            tap_action:
              action: perform-action
              perform_action: script.alternar_luzes_do_bloco
              data:
                area: Cozinha
                excluir: light\..*_grupo|light\.grupo_.*|light\.todas_as_luzes|light\..*lavanderia.*|light\..*dispensa.*
            hold_action:
              action: navigate
              navigation_path: /painel-novo/cozinha
            double_tap_action:
              action: navigate
              navigation_path: /painel-novo/cozinha
            grid_options:
              columns: full
          - type: custom:auto-entities
            card:
              type: custom:mushroom-chips-card
              alignment: start
            card_param: chips
            show_empty: false
            filter:
              include:
                - domain: light
                  area: Cozinha
                  options:
                    type: entity
                    content_info: name
                    use_light_color: true
                    tap_action:
                      action: toggle
                    hold_action:
                      action: more-info
              exclude:
                - entity_id: light.*_grupo
                - entity_id: light.grupo_*
                - entity_id: light.todas_as_luzes
                - entity_id: light.*lavanderia*
                - entity_id: light.*dispensa*
            grid_options:
              columns: full
            sort:
              method: friendly_name
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            show_empty: false
            filter:
              include:
                - domain: cover
                  area: Cozinha
                  options:
                    type: custom:mushroom-cover-card
                    layout: horizontal
                    show_buttons_control: true
                    show_position_control: false
                    tap_action:
                      action: more-info
                    hold_action:
                      action: more-info
              exclude: []
            grid_options:
              columns: full
            sort:
              method: friendly_name
          - type: custom:auto-entities
            card:
              type: grid
              columns: 1
              square: false
            card_param: cards
            show_empty: false
            filter:
              include:
                - domain: sensor
                  area: Cozinha
                  options:
                    type: tile
                    vertical: false
                    hide_state: false
                    tap_action:
                      action: more-info
                - domain: binary_sensor
                  area: Cozinha
                  options:
                    type: tile
                    vertical: false
                    hide_state: false
                    tap_action:
                      action: more-info
              exclude: []
            grid_options:
              columns: full
            sort:
              method: friendly_name
      - type: grid
        cards:
          - type: heading
