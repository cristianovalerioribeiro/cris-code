<svg xmlns="http://www.w3.org/2000/svg" width="190mm" height="126mm" viewBox="0 0 190 126" font-family="Inter, 'DejaVu Sans', Arial, sans-serif"><rect x="0" y="0" width="190" height="126" fill="white"/><rect x="34" y="12" width="74.0" height="45.0" fill="#e3f4e1" stroke="#2b2b2b" stroke-width="0.4"/><text x="71.0" y="24.0" font-size="4.4" fill="#111" font-weight="800" text-anchor="middle">ENVOLVER DE PERTO</text><text font-size="2.9" fill="#555" font-weight="500" text-anchor="middle"><tspan x="71.00" y="32.35">pode decidir ou travar, e se importa:</tspan><tspan x="71.00" y="35.68">conversa direta, participação, retorno rápido</tspan></text><rect x="108.0" y="12" width="74.0" height="45.0" fill="#dcecfb" stroke="#2b2b2b" stroke-width="0.4"/><text x="145.0" y="24.0" font-size="4.4" fill="#111" font-weight="800" text-anchor="middle">MANTER SATISFEITO</text><text font-size="2.9" fill="#555" font-weight="500" text-anchor="middle"><tspan x="145.00" y="32.35">pode decidir ou travar, pouco se importa:</tspan><tspan x="145.00" y="35.68">segurança, pouca demanda, sem surpresas</tspan></text><rect x="34" y="57.0" width="74.0" height="45.0" fill="#fff6cc" stroke="#2b2b2b" stroke-width="0.4"/><text x="71.0" y="69.0" font-size="4.4" fill="#111" font-weight="800" text-anchor="middle">MANTER INFORMADO</text><text font-size="2.9" fill="#555" font-weight="500" text-anchor="middle"><tspan x="71.00" y="77.35">não decide, mas se importa:</tspan><tspan x="71.00" y="80.68">informação regular; pode virar aliado</tspan></text><rect x="108.0" y="57.0" width="74.0" height="45.0" fill="#fde2e2" stroke="#2b2b2b" stroke-width="0.4"/><text x="145.0" y="69.0" font-size="4.4" fill="#111" font-weight="800" text-anchor="middle">ACOMPANHAR DE LONGE</text><text font-size="2.9" fill="#555" font-weight="500" text-anchor="middle"><tspan x="145.00" y="77.35">não decide e pouco se importa:</tspan><tspan x="145.00" y="80.68">monitorar; não gastar energia</tspan></text><text x="71.0" y="9" font-size="3.4" fill="#1f4e8c" font-weight="700" text-anchor="middle">INTERESSE ALTO</text><text x="145.0" y="9" font-size="3.4" fill="#1f4e8c" font-weight="700" text-anchor="middle">INTERESSE BAIXO</text><text x="108.0" y="108" font-size="3.0" fill="#555" text-anchor="middle">interesse do ator no projeto (G124, nota 0 a 10)</text><text font-size="3.4" fill="#1f4e8c" font-weight="700" text-anchor="middle" transform="translate(30 34.5) rotate(-90)">ALTO</text><text font-size="3.4" fill="#1f4e8c" font-weight="700" text-anchor="middle" transform="translate(30 79.5) rotate(-90)">BAIXO</text><text font-size="3.0" fill="#555" text-anchor="middle" transform="translate(22 57.0) rotate(-90)">poder de decidir ou travar (G124, nota 0 a 10)</text><circle cx="108.0" cy="57.0" r="2.4" fill="white" stroke="#1f4e8c" stroke-width="0.7"/><circle cx="108.0" cy="57.0" r="0.9" fill="#1f4e8c"/><rect x="88.00" y="118.00" width="40" height="12" rx="1.2" fill="none" stroke="#9a9a9a" stroke-width="0.45" stroke-dasharray="1.4 1"/></svg>