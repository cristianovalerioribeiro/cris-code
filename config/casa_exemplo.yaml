# =============================================================================
#  Casa de exemplo — usada SOMENTE pelo tools/preview.py
# =============================================================================
#  Nao vai para o Home Assistant. Serve para desenhar o painel numa pagina e
#  conferir a usabilidade antes de instalar, com comodos de tamanhos bem
#  diferentes (de 1 ate 6 luminarias) para testar se o layout se adapta.
# =============================================================================

areas:
  Sala de Estar:
    # grupo de luz do comodo (Ajudantes > Grupo) — vira o card mestre com slider
    - {id: light.sala_luzes,         nome: Luzes da sala,    estado: "on",  brilho: 51}
    - {id: light.sala_lustre,        nome: Lustre,           estado: "on",  brilho: 78}
    - {id: light.sala_spots,         nome: Spots do teto,    estado: "on",  brilho: 45}
    - {id: light.sala_abajur,        nome: Abajur,           estado: "off"}
    - {id: light.sala_fita_led,      nome: Fita LED,         estado: "on",  brilho: 30}
    - {id: cover.sala_persiana,      nome: Persiana,         estado: open,  posicao: 100}
    - {id: cover.sala_cortina,       nome: Cortina,          estado: closed, posicao: 0}
    - {id: sensor.sala_temperatura,  nome: Temperatura,      estado: "23.4", unidade: "°C"}
    - {id: sensor.sala_umidade,      nome: Umidade,          estado: "54",   unidade: "%"}
    - {id: climate.sala_ar,          nome: Ar-condicionado,  estado: cool}
    - {id: fan.sala_ventilador,      nome: Ventilador,       estado: "off"}
    - {id: media_player.sala_tv,     nome: TV,               estado: playing}

  Cozinha:
    - {id: light.cozinha_teto,       nome: Teto,             estado: "off"}
    - {id: light.cozinha_bancada,    nome: Bancada,          estado: "on",  brilho: 90}
    - {id: cover.cozinha_persiana,   nome: Persiana,         estado: open,  posicao: 60}
    - {id: sensor.cozinha_temperatura, nome: Temperatura,    estado: "25.1", unidade: "°C"}
    - {id: binary_sensor.cozinha_gas,  nome: Vazamento de gas, estado: "off", classe: gas}
    - {id: switch.cozinha_cafeteira, nome: Cafeteira,        estado: "off"}

  Corredor:
    - {id: light.corredor_arandela,  nome: Arandela,         estado: "on",  brilho: 20}
    - {id: binary_sensor.corredor_movimento, nome: Movimento, estado: "on", classe: motion}
    - {id: sensor.corredor_temperatura, nome: Temperatura,   estado: "22.0", unidade: "°C"}

  Quarto:
    - {id: light.quarto_plafon,      nome: Plafon,           estado: "off"}
    - {id: light.quarto_cabeceira_e, nome: Cabeceira esquerda, estado: "on", brilho: 15}
    - {id: light.quarto_cabeceira_d, nome: Cabeceira direita, estado: "off"}
    - {id: cover.quarto_blackout,    nome: Blackout,         estado: closed, posicao: 0}
    - {id: cover.quarto_persiana,    nome: Persiana,         estado: open,   posicao: 35}
    - {id: sensor.quarto_temperatura, nome: Temperatura,     estado: "21.8", unidade: "°C"}
    - {id: sensor.quarto_umidade,    nome: Umidade,          estado: "58",   unidade: "%"}
    - {id: climate.quarto_ar,        nome: Ar-condicionado,  estado: "off"}

  Quarto de Hóspedes:
    - {id: light.hospedes_plafon,    nome: Plafon,           estado: "off"}
    - {id: cover.hospedes_persiana,  nome: Persiana,         estado: closed, posicao: 0}
    - {id: sensor.hospedes_temperatura, nome: Temperatura,   estado: "22.6", unidade: "°C"}

  Escritório:
    - {id: light.escritorio_teto,    nome: Teto,             estado: "on",  brilho: 100}
    - {id: light.escritorio_luminaria, nome: Luminaria de mesa, estado: "on", brilho: 65}
    - {id: light.escritorio_ring,    nome: Ring light,       estado: "off"}
    - {id: light.escritorio_backlight, nome: Backlight monitor, estado: "on", brilho: 55}
    - {id: light.escritorio_estante, nome: Estante,          estado: "off"}
    - {id: cover.escritorio_persiana, nome: Persiana,        estado: open,  posicao: 80}
    - {id: sensor.escritorio_temperatura, nome: Temperatura, estado: "24.2", unidade: "°C"}
    - {id: binary_sensor.escritorio_janela, nome: Janela,    estado: "off", classe: window}

  Banheiro:
    - {id: light.banheiro_teto,      nome: Teto,             estado: "off"}
    - {id: light.banheiro_espelho,   nome: Espelho,          estado: "off"}
    - {id: sensor.banheiro_umidade,  nome: Umidade,          estado: "71",   unidade: "%"}

  Área Externa:
    - {id: light.externa_garagem,    nome: Garagem,          estado: "on",  brilho: 100}
    - {id: light.externa_jardim,     nome: Jardim,           estado: "on",  brilho: 60}
    - {id: light.externa_piscina,    nome: Piscina,          estado: "off"}
    - {id: light.externa_churrasq,   nome: Churrasqueira,    estado: "off"}
    - {id: light.externa_portao,     nome: Portao,           estado: "on",  brilho: 100}
    - {id: light.externa_corredor,   nome: Corredor lateral, estado: "off"}
    - {id: cover.externa_portao,     nome: Portao basculante, estado: closed, posicao: 0}
    - {id: binary_sensor.externa_movimento, nome: Movimento, estado: "off", classe: motion}
    - {id: sensor.externa_temperatura, nome: Temperatura,    estado: "19.3", unidade: "°C"}
