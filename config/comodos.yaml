# =============================================================================
#  Painel Novo — arquivo de configuracao
# =============================================================================
#  Este e o UNICO arquivo que voce precisa editar.
#  Depois de mexer aqui, rode:
#
#      python3 tools/gerar_painel.py
#
#  e o arquivo dashboards/painel-novo.yaml e regerado do zero.
#
#  As luminarias NAO sao listadas aqui: o painel descobre sozinho todas as
#  luzes de cada area do Home Assistant. Se voce adicionar uma lampada nova
#  na Cozinha, ela aparece no painel sem editar nada.
# =============================================================================

painel:
  titulo: Casa                 # titulo da aba principal
  url: painel-novo             # precisa bater com o url_path do configuration.yaml
  colunas_max: 4               # maximo de colunas em telas grandes (o HA reduz sozinho no celular)
  colunas_luzes: 2             # quantas luminarias por linha dentro do card do comodo
  densidade: true              # true = encaixa secoes curtas nos buracos (layout mais compacto)
  view_luzes: true             # gera a aba "Luzes" (brilho de todas as luminarias)
  estilo_luzes: botoes         # botoes = 1 botao redondo por luminaria (compacto)
                               # cards  = 1 card com slider por luminaria (ocupa muito mais)
  mostrar_persianas: true      # persianas/cortinas no bloco do comodo
  mostrar_sensores: true       # sensores do comodo no rodape do bloco
  cor_na_tela_inicial: true    # controle de cor/temperatura no mestre da tela Casa.
                               # false deixa a tela Casa mais baixa; a cor continua
                               # disponivel na pagina do comodo. So tem efeito nos
                               # comodos que definem 'grupo'.
  subviews: true               # gera uma pagina de detalhe para cada comodo
  usar_script_inteligente: true  # ver packages/painel_novo.yaml (recomendado)

globais:
  # Padroes de entity_id ignorados em TODOS os comodos.
  # Util para nao duplicar grupos de luz que voce mesmo criou.
  excluir_luzes:
    - light.*_grupo
    - light.grupo_*
    - light.todas_as_luzes

# -----------------------------------------------------------------------------
#  COMODOS
# -----------------------------------------------------------------------------
#  area      -> nome EXATO da area no Home Assistant (Configuracoes > Areas)
#  area_id   -> opcional. Se o id da area nao for o nome "slugificado", informe.
#               Confira em Ferramentas de Desenvolvedor > Modelo:
#                   {{ areas() }}
#  icone     -> qualquer icone mdi:
#  cor       -> cor de destaque do comodo. Se omitir, o gerador distribui uma
#               automaticamente. Valores: amber, blue, green, purple, teal,
#               pink, indigo, cyan, orange, light-green, deep-purple, red
#  grupo     -> OPCIONAL, mas muito recomendado: uma entidade de grupo de luz
#               (Configuracoes > Dispositivos e servicos > Ajudantes > Grupo).
#               Com ela, o card mestre ganha slider de brilho do comodo inteiro.
#  temperatura / umidade -> opcionais, viram etiquetas no titulo do comodo
#  extras    -> entidades avulsas que aparecem no rodape do comodo
#               (ar-condicionado, ventilador, cortina, TV, ...)
#  excluir   -> padroes de entity_id de luz ignorados so neste comodo
# -----------------------------------------------------------------------------

comodos:
  - area: Sala de Estar
    icone: mdi:sofa
    cor: amber
    grupo: light.sala_luzes
    temperatura: sensor.sala_temperatura
    umidade: sensor.sala_umidade
    extras:
      - climate.sala_ar
      - media_player.sala_tv

  - area: Cozinha
    icone: mdi:countertop
    cor: orange
    temperatura: sensor.cozinha_temperatura

  - area: Corredor
    icone: mdi:wall-sconce-flat
    cor: teal
    temperatura: sensor.corredor_temperatura

  - area: Quarto
    icone: mdi:bed-double
    cor: indigo
    temperatura: sensor.quarto_temperatura
    umidade: sensor.quarto_umidade
    extras:
      - climate.quarto_ar

  - area: Quarto de Hóspedes
    icone: mdi:bed-single
    cor: purple
    temperatura: sensor.hospedes_temperatura

  - area: Escritório
    icone: mdi:desk
    cor: blue
    temperatura: sensor.escritorio_temperatura

  - area: Banheiro
    icone: mdi:shower
    cor: cyan
    umidade: sensor.banheiro_umidade

  - area: Área Externa
    icone: mdi:tree
    cor: green
    temperatura: sensor.externa_temperatura
