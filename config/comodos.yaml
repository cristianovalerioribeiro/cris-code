# =============================================================================
#  Painel Novo — arquivo de configuracao
# =============================================================================
#  Este e o UNICO arquivo que voce precisa editar.
#  Depois de mexer aqui, rode:
#
#      python3 tools/gerar_painel.py && python3 tools/validar.py
#
#  As luminarias NAO sao listadas uma a uma quando o comodo tem area propria:
#  o painel descobre sozinho as luzes daquela area. Onde um comodo precisa ser
#  partido em dois blocos (Cozinha / Lavanderia, Gourmet / Lavabo), use
#  'luzes:' com padroes de entity_id — ver o bloco COMO PARTIR UM COMODO.
# =============================================================================

painel:
  titulo: Casa
  url: painel-novo             # precisa bater com o url_path do configuration.yaml
  colunas_max: 3               # maximo de colunas em telas grandes
  brilho: nunca                # lampadas comuns de liga/desliga
  colunas_luzes: 2             # luminarias por linha na aba Luzes e na pagina do comodo
  densidade: true
  estilo_luzes: botoes
  mostrar_persianas: true
  mostrar_sensores: true
  cor_na_tela_inicial: true

  # O "painel geral" (resumo da casa toda). Fica como a ULTIMA aba, porque no
  # dia a dia quem manda sao as abas de pavimento.
  resumo: true
  resumo_no_fim: true

  # Aba unica com todas as luminarias da casa. Desligada: as abas de pavimento
  # ja fazem esse papel, e ela viraria um segundo painel geral.
  view_luzes: false

  subviews: true               # pagina de detalhe por comodo
  usar_script_inteligente: true

globais:
  excluir_luzes:
    - light.*_grupo
    - light.grupo_*
    - light.todas_as_luzes

# =============================================================================
#  COMO PARTIR UM COMODO
# =============================================================================
#  Cada item de 'comodos' e um BLOCO na tela — nao precisa ser uma area do
#  Home Assistant. Campos:
#
#   nome            rotulo do bloco e URL da pagina dele. Precisa ser unico.
#   area            area do HA de onde vem luzes, persianas e sensores.
#   icone / cor     aparencia.
#   luzes           OPCIONAL. Padroes de entity_id. Com isso, o bloco pega
#                   SO as luzes da area que casam com os padroes.
#   excluir         OPCIONAL. Padroes que este bloco ignora. Use no bloco
#                   "principal" para tirar o que foi para o bloco separado.
#   luzes_de_fora   OPCIONAL. Padroes de luzes de OUTRA area que devem aparecer
#                   aqui (ex.: as laterais que sao da Area Externa mas fazem
#                   parte da Sala de Estar).
#   persianas       OPCIONAL (true/false). Ponha false no bloco separado para
#   sensores        nao repetir as persianas e sensores do bloco principal.
#   temperatura     OPCIONAL. Sensores que viram etiqueta no titulo.
#   umidade
#   extras          OPCIONAL. Entidades avulsas (ar, ventilador, TV...).
#
#  ATENCAO aos padroes de 'luzes': eles sao CHUTES a partir dos nomes que voce
#  falou. Confira os entity_id reais com:
#
#      python3 tools/descobrir.py
#
#  e cole o template no Home Assistant em Ferramentas de Desenvolvedor > Modelo.
# =============================================================================

pavimentos:
  # ---------------------------------------------------------------- TERREO --
  - nome: Térreo
    icone: mdi:home-floor-g
    comodos:
      - nome: Cozinha
        area: Cozinha
        icone: mdi:countertop
        cor: orange
        # tira do bloco da cozinha o que foi para a lavanderia/dispensa
        excluir:
          - light.*lavanderia*
          - light.*dispensa*

      - nome: Lavanderia e Dispensa
        area: Cozinha
        icone: mdi:washing-machine
        cor: teal
        luzes:
          - light.*lavanderia*
          - light.*dispensa*
        persianas: false
        sensores: false

      - nome: Gourmet
        area: Gourmet
        icone: mdi:silverware-fork-knife
        cor: amber
        # o lavabo (pendente, LED e ducha) tem bloco proprio
        excluir:
          - light.*lavabo*
          - light.*pendente*
          - light.*ducha*

      - nome: Lavabo
        area: Gourmet
        icone: mdi:toilet
        cor: cyan
        luzes:
          - light.*pendente*
          - light.*lavabo*
          - light.*ducha*
        persianas: false
        sensores: false

      - nome: Sala de Estar
        area: Sala de Estar
        icone: mdi:sofa
        cor: blue
        # as tres laterais sao da Area Externa mas pertencem a sala
        luzes_de_fora:
          - light.*lateral_fundo*
          - light.*lateral_frente*
          - light.*lateral_passarela*

      - nome: Espaço Kids e Home
        area: Espaço Kids e Home
        icone: mdi:teddy-bear
        cor: purple

      - nome: Banho Social
        area: Banho Social
        icone: mdi:shower
        cor: indigo

      - nome: Garagem
        area: Garagem
        icone: mdi:garage
        cor: green

      - nome: Área Externa
        area: Área Externa
        icone: mdi:tree
        cor: light-green
        # fica so com a arandela do fundo e a lateral direita;
        # as outras laterais foram para a Sala de Estar
        luzes:
          - light.*arandela_fundo*
          - light.*lateral_direita*

      - nome: Pé Direito Duplo
        area: Pé Direito Duplo
        icone: mdi:arrow-expand-vertical
        cor: pink

  # -------------------------------------------------------- 1o PAVIMENTO --
  # Voce falou que usa o 1o pavimento, mas nao detalhou o que tem nele.
  # Preencha os blocos aqui e ele ganha uma aba; vazio, a aba nao e gerada.
  - nome: 1º Pavimento
    icone: mdi:home-floor-1
    comodos: []

  # --------------------------------------- 2o PAVIMENTO - lado escritorio --
  # Nome curto de proposito: a barra de abas do celular corta nomes longos.
  - nome: 2º Escritório
    icone: mdi:home-floor-2
    comodos:
      - nome: Escritório
        area: Escritório
        icone: mdi:desk
        cor: blue
        # o banheiro do escritorio ainda nao tem rele identificado;
        # quando identificar, mova os padroes para o bloco de baixo
        excluir:
          - light.*banheiro*

      - nome: Quarto de Visitas
        area: Quarto de Visitas
        icone: mdi:bed-single
        cor: purple

      - nome: Banheiro do Escritório
        area: Escritório
        icone: mdi:shower
        cor: cyan
        # PENDENTE: rele ainda nao identificado. Ajuste o padrao quando souber
        # o entity_id real, senao este bloco aparece vazio.
        luzes:
          - light.*escritorio_banheiro*
          - light.*banheiro_escritorio*
        persianas: false
        sensores: false

  # ------------------------------------------ 2o PAVIMENTO - lado intimo --
  - nome: 2º Íntimo
    icone: mdi:home-floor-2
    comodos:
      # primeira coisa ao entrar no pavimento
      - nome: Hall e Rouparia
        area: Hall e Rouparia
        icone: mdi:wardrobe
        cor: teal

      - nome: Estar Íntimo
        area: Estar Íntimo
        icone: mdi:sofa-outline
        cor: amber

      - nome: Suíte
        area: Suíte
        icone: mdi:bed-king
        cor: indigo
        excluir:
          - light.*banheiro*
          - light.*banho*

      - nome: Banheiro da Suíte
        area: Suíte
        icone: mdi:bathtub
        cor: cyan
        luzes:
          - light.*suite_banheiro*
          - light.*banheiro_suite*
        persianas: false
        sensores: false

      - nome: Quarto Guto
        area: Quarto Guto
        icone: mdi:bed
        cor: green

      - nome: Quarto Bia
        area: Quarto Bia
        icone: mdi:bed
        cor: pink
