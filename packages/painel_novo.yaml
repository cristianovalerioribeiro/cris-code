# =============================================================================
#  Painel Novo — package de apoio
# =============================================================================
#  Instalacao (uma vez so):
#
#  1. Em configuration.yaml, garanta que packages esteja habilitado:
#
#         homeassistant:
#           packages: !include_dir_named packages
#
#  2. Copie este arquivo para  <config>/packages/painel_novo.yaml
#  3. Reinicie o Home Assistant.
#
#  Este script e OBRIGATORIO quando algum bloco do painel usa 'luzes:',
#  'luzes_de_fora:' ou 'excluir:'. Sem ele, o toque no mestre agiria na area
#  inteira — apagar a "Lavanderia e Dispensa" apagaria a cozinha toda.
# =============================================================================

script:
  alternar_luzes_do_bloco:
    alias: Alternar luzes do bloco
    description: >-
      Se houver qualquer luz acesa no bloco, apaga todas; se estiver tudo
      apagado, acende todas. Recebe os mesmos filtros que o painel usa para
      montar a lista de luminarias do bloco, para agir exatamente nelas.
    icon: mdi:lightbulb-group
    mode: parallel
    max: 25
    fields:
      area:
        name: Area
        description: Nome ou id da area no Home Assistant. Vazio = toda a casa.
        required: false
        example: Cozinha
        selector:
          area:
      padrao:
        name: Padrao
        description: >-
          Regex comparado com o entity_id E com o nome amigavel, em minusculas.
          Ex.: .*lavanderia.*|.*dispensa.*
        required: false
        selector:
          text:
      de_fora:
        name: Luzes de fora
        description: >-
          Regex de luzes de OUTRAS areas que tambem pertencem a este bloco.
        required: false
        selector:
          text:
      excluir:
        name: Excluir
        description: Regex de luzes que este bloco ignora.
        required: false
        selector:
          text:
    sequence:
      # Reproduz, em Jinja, os mesmos filtros do auto-entities: cada padrao e
      # comparado com o entity_id E com o nome amigavel, sem distinguir
      # maiusculas. Cada variavel pode usar as anteriores, entao a ordem importa.
      - variables:
          todas: "{{ states.light | map(attribute='entity_id') | list }}"
          base: >-
            {{ (area_entities(area) if area is defined and area else todas) | select('match', 'light\.') | list }}
          escolhidas: >-
            {% if padrao is defined and padrao %}{% set ns = namespace(r=[]) %}{% for e in base %}{% set nm = (state_attr(e, 'friendly_name') or '') | lower %}{% if ((e | lower) is search(padrao) or nm is search(padrao)) %}{% set ns.r = ns.r + [e] %}{% endif %}{% endfor %}{{ ns.r }}{% else %}{{ base }}{% endif %}
          extras: >-
            {% if de_fora is defined and de_fora %}{% set ns = namespace(r=[]) %}{% for e in todas %}{% set nm = (state_attr(e, 'friendly_name') or '') | lower %}{% if ((e | lower) is search(de_fora) or nm is search(de_fora)) %}{% set ns.r = ns.r + [e] %}{% endif %}{% endfor %}{{ ns.r }}{% else %}{{ [] }}{% endif %}
          juntas: "{{ (escolhidas + extras) | unique | list }}"
          alvos: >-
            {% if excluir is defined and excluir %}{% set ns = namespace(r=[]) %}{% for e in juntas %}{% set nm = (state_attr(e, 'friendly_name') or '') | lower %}{% if not ((e | lower) is search(excluir) or nm is search(excluir)) %}{% set ns.r = ns.r + [e] %}{% endif %}{% endfor %}{{ ns.r }}{% else %}{{ juntas }}{% endif %}

      # Bloco sem nenhuma luz: nada a fazer. Evita chamar o servico com lista
      # vazia, o que acontece enquanto um rele ainda nao foi identificado.
      - condition: template
        value_template: "{{ alvos | count > 0 }}"

      - choose:
          - conditions:
              - condition: template
                value_template: "{{ alvos | select('is_state', 'on') | list | count > 0 }}"
            sequence:
              - action: light.turn_off
                target:
                  entity_id: "{{ alvos }}"
        default:
          - action: light.turn_on
            target:
              entity_id: "{{ alvos }}"
